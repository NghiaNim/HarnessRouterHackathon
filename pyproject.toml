[project]
name = "hive"
version = "0.1.0"
description = "Shared brain for teams of coding agents, built on HarnessRouter"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "mcp>=1.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "pathspec>=1.1.1",
]

[project.scripts]
hive = "hive.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Contract style choices in hive/models.py: timezone.utc, (str, Enum) for pydantic/JSON, Union alias.
ignore = ["UP017", "UP042", "UP007"]

[tool.pytest.ini_options]
testpaths = ["tests"]
