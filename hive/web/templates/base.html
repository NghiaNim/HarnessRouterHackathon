<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Hive{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  {# Vendored (htmx 2.0.4, SSE extension 2.2.2) so the dashboard works with no internet. HarnessRouter is never
     called from the browser: pages talk to this server only. #}
  <script src="/static/vendor/htmx-2.0.4.min.js" defer></script>
  <script src="/static/vendor/htmx-ext-sse-2.2.2.js" defer></script>
  <script src="/static/app.js" defer></script>
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Hive</a>
    <nav aria-label="Sections">
      {% for key, label, path in nav %}
      <a href="{{ path }}" {% if active == key %}aria-current="page"{% endif %}>{{ label }}</a>
      {% endfor %}
    </nav>
    <label class="me">
      <span>You are</span>
      {# Pages send this as `by` on any action that needs a human: add hx-include="#me" to the element. #}
      <input id="me" name="by" placeholder="GitHub handle" autocomplete="off" spellcheck="false"
             title="Your GitHub handle. Only humans can accept or reject decisions.">
      <span class="me-hint">humans only</span>
    </label>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
